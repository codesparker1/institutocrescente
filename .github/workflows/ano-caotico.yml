name: Ano caótico (simulação de ano letivo completo)

# Gatilho manual só — muito mais pesado que o cost-meter (7 marcos, agentes caóticos, rajadas de
# pico). Ver plano em C:\Users\hp\.claude\plans\iridescent-watching-plum.md.
on:
  workflow_dispatch:
    inputs:
      alunos:
        description: "Contextos concorrentes de aluno por marco"
        default: "8"
      professores:
        description: "Contextos concorrentes de professor por marco"
        default: "3"

jobs:
  ano-caotico:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: institutocrescente_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/institutocrescente_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/institutocrescente_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Gerar AUTH_SECRET efémero
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Guarda anti-Neon (falha se DATABASE_URL/DIRECT_URL apontar para Neon)
        run: |
          npx tsx -e "import { garantirNaoENeon } from './scripts/lib/guardarNeon'; garantirNaoENeon(); console.log('OK: alvo nao e Neon.');"

      - name: Aplicar migrações
        run: npx prisma migrate deploy

      - name: Seed em larga escala (5 cursos, 100 professores, 1000 alunos)
        run: npm run seed:grande

      - name: Build de produção
        run: npm run build

      - name: Iniciar `next start` em segundo plano
        env:
          # Sem isto, getAgora() (src/lib/tempo.ts) ignora .relogio e o servidor usa sempre a
          # hora real — avancarRelogio() escreveria o ficheiro para nada, e todos os marcos
          # dependentes do relógio (prazos de notas, janela de rematrícula, ano letivo) corriam
          # contra "agora" real em vez da data simulada de cada marco.
          SIMULATION_MODE: "true"
        run: |
          npm run start > next-start.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/login > /dev/null; then
              echo "Servidor pronto."
              exit 0
            fi
            sleep 2
          done
          echo "Servidor não respondeu a tempo." >&2
          exit 1

      - name: Instalar browsers do Playwright
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      # Achado por uma corrida real: playwright install ficou preso ~1h20 num runner (apt/rede
      # instável), consumindo o timeout de 90min do job inteiro sem produzir sequer o primeiro
      # marco. O timeout acima (10min, bem acima do normal de segundos) falha depressa em vez de
      # silenciosamente comer o orçamento todo; este aqui protege a corrida em si da mesma forma.
      - name: Simulação caótica do ano letivo (7 marcos)
        timeout-minutes: 40
        run: npx tsx scripts/simulacao/run-ano.ts --url http://localhost:3000 --alunos "${{ inputs.alunos }}" --professores "${{ inputs.professores }}"

      - name: Parar servidor
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

      - name: Relatório por marco
        if: always()
        run: npx tsx scripts/seed-grande/relatorio-ano.ts

      - name: Publicar artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ano-caotico-resultados
          path: |
            scripts/simulacao/output/**
            scripts/seed-grande/output/**
            stress-logs/**
            next-start.log
          retention-days: 14
